version: '3.8'
services:
  backend:
    build: .
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - PORT=${PORT:-9000}
      - REDIS_URL=${REDIS_URL} # This will now automatically pull your Cloud URL from the .env file
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
